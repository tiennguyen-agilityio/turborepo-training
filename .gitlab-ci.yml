image: node:20-bullseye

stages:
  - prepare
  - build_web
  - deploy_web

variables:
  NODE_ENV: production
  NODE_OPTIONS: "--max-old-space-size=4096"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .turbo/
    - apps/web/.next/

.before_script: &before_script
  - corepack enable
  - corepack prepare pnpm@8 --activate
  - pnpm install --frozen-lockfile
  - npm install -g vercel@33.2.0

prepare:
  stage: prepare
  script:
    - echo "$VERCEL_TOKEN"

build_web:
  stage: build_web
  needs: ["prepare"]
  script:
    - *before_script
    - pnpm build:web
    - vercel pull --token $VERCEL_TOKEN --yes
    - vercel build --prod --token $VERCEL_TOKEN --yes
  artifacts:
    paths:
      - .vercel/output
      - .vercel/project.json
    expire_in: 1 week

deploy_web:
  stage: deploy_web
  needs: ["build_web"]
  script:
    - ls -la .vercel/output
    - vercel deploy --prebuilt --prod --token $VERCEL_TOKEN
  rules:
    - if: '$CI_COMMIT_BRANCH == "feature/turborepo"'
      when: on_success

deploy_web_preview:
  stage: deploy_web
  needs: ["build_web"]
  script:
    - *before_script
    - ls -la .vercel/output
    - vercel deploy --prebuilt --prod --token $VERCEL_TOKEN
  rules:
    - if: '$CI_COMMIT_BRANCH != "main"'
      when: on_success
